<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foxbridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-sidebar: #ffffff;
      --bg-chat: #fafafa;
      --bg-panel: #ffffff;
      --bg-input: #ffffff;
      --bg-user-msg: #0052cc;
      --bg-asst-msg: #ffffff;
      --bg-prompt: #f0f4ff;
      --bg-hover: #e8f0fe;
      --border: #e8e8e8;
      --border-msg: #e0e0e0;
      --text: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --text-on-primary: #ffffff;
      --primary: #0052cc;
      --primary-light: #1565c0;
      --badge-bug: #d32f2f;
      --badge-task: #1565c0;
      --badge-story: #2e7d32;
      --badge-highest: #ff5722;
      --badge-high: #f44336;
      --badge-medium: #ff9800;
      --badge-low: #4caf50;
      --code-bg: #f0f0f0;
      --table-header-bg: #f5f5f5;
      --table-border: #dddddd;
      --label-bg: #e3f2fd;
      --label-text: #1565c0;
    }

    [data-theme="dark"] {
      --bg-sidebar: #1a1a2e;
      --bg-chat: #121212;
      --bg-panel: #1a1a1a;
      --bg-input: #2a2a2a;
      --bg-user-msg: #1565c0;
      --bg-asst-msg: #1e1e1e;
      --bg-prompt: #1e2a3a;
      --bg-hover: #2a3a4e;
      --border: #2a2a3e;
      --border-msg: #333333;
      --text: #e0e0e0;
      --text-secondary: #aaaaaa;
      --text-muted: #777777;
      --text-on-primary: #ffffff;
      --primary: #4d8fcc;
      --primary-light: #6ba5d9;
      --code-bg: #2a2a2a;
      --table-header-bg: #2a2a2a;
      --table-border: #444444;
      --label-bg: #1e2a3a;
      --label-text: #6ba5d9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-chat);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
